services:
  web:
    build: .
    container_name: fashion-hub-web
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-fashion_hub}
      DB_USER: ${DB_USER:-fashion_user}
      DB_PASSWORD: ${DB_PASSWORD:-fashion_pass}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: fashion-hub-db
    environment:
      MYSQL_DATABASE: ${DB_NAME:-fashion_hub}
      MYSQL_USER: ${DB_USER:-fashion_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-fashion_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pass_change_me}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root_pass_change_me}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data:
