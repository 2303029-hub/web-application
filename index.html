<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Fashion Hub </title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet"> <!-- Google Font -->
    <style>
        body {
            font-family: 'Poppins', sans-serif; /* Changed to Poppins */
            margin: 0;
            padding: 0;
            background: linear-gradient(to right, #f0f0f0, #d9d9d9);
            color: #333;
        }
        header {
            background: linear-gradient(to right, #de7fc3, #e27ed0);
            color: #ffffff;
            padding: 30px 0;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        nav {
            background: #dba6d8;
            padding: 15px 0;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        nav a {
            color: #ffffff;
            margin: 0 20px;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }
        nav a:hover {
            color: #ffd700; /* Gold color on hover */
        }
        .main {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 40px;
        }
        .card {
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            margin: 20px;
            padding: 30px;
            width: 320px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
        }
        .card h3 {
            color: #ff6f61;
            font-size: 1.5em;
            margin-bottom: 10px;
        }
        .card p {
            color: #666;
            margin-bottom: 20px;
        }
        button {
            background: linear-gradient(to right, #ff6f61, #de5d83);
            color: #ffffff;
            border: none;
            border-radius: 25px;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s, transform 0.3s;
        }
        button:hover {
            background: #de5d83;
            transform: scale(1.05);
        }
        footer {
            background: #35424a;
            color: #ffffff;
            text-align: center;
            padding: 15px 0;
            position: relative;
            bottom: 0;
            width: 100%;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
        }
        .tall-f {
            display: inline-block; /* Allows transform to work */
            transform: scaleY(1.5); /* Increase height */
            line-height: 1; /* Adjust line height to prevent spacing issues */
        }
    </style>
</head>
